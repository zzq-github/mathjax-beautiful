name: Publish to NPM

on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/**'
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag matching packages/core/package.json (e.g. v1.4.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-vue-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Check release tag and source
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const {version} = JSON.parse(readFileSync("packages/core/package.json")); if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) throw new Error("Tag must match the stable Vue package version");'
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/master
      - run: pnpm install --frozen-lockfile
      - name: Run all regression tests
        run: pnpm exec vitest run
      - run: pnpm type-check
      - run: pnpm build:all
      - name: Pack and install in an isolated consumer
        run: pnpm test:package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist/release
      - name: Publish the verified tarball
        run: node scripts/publish-package.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry version, integrity and latest tag
        run: node scripts/verify-registry.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/release/*.tgz --verify-tag --title "vue-mathjax-beautiful $RELEASE_TAG" --generate-notes
          fi
