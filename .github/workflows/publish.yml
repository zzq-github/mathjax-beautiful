name: Publish to NPM

on:
  push:
    tags: ['v[0-9]*', 'react-v[0-9]*']
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/**'
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag: vX.Y.Z (Vue) or react-vX.Y.Z (React)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-packages-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
      package: ${{ steps.target.outputs.package }}
      package-name: ${{ steps.target.outputs.package-name }}
      artifact-dir: ${{ steps.target.outputs.artifact-dir }}
      artifact-file: ${{ steps.target.outputs.artifact-file }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select and validate release package
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { releaseTargetForTag } from './scripts/release-target.mjs';
          const fallback = `v${JSON.parse(readFileSync('packages/core/package.json')).version}`;
          const target = releaseTargetForTag(process.env.RELEASE_TAG || fallback);
          const manifest = JSON.parse(readFileSync(`${target.directory}/package.json`));
          assert.equal(manifest.name, target.name);
          assert.equal(manifest.version, target.version, 'Tag must match the selected package version');
          appendFileSync(process.env.GITHUB_OUTPUT, `package=${target.key}\npackage-name=${target.name}\nartifact-dir=${target.artifactDir}\nartifact-file=${target.name}-${target.version}.tgz\n`);
          JS
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Check release tag and source
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/master
      - run: pnpm install --frozen-lockfile
      - name: Run all regression tests
        run: pnpm exec vitest run
      - run: pnpm type-check
      - run: pnpm build:all
      - name: Pack and install in an isolated consumer
        run: pnpm test:package
      - name: Verify isolated React 18 and React 19 consumers
        run: pnpm test:package:react
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            ${{ steps.target.outputs.artifact-dir }}/${{ steps.target.outputs.artifact-file }}
            ${{ steps.target.outputs.artifact-dir }}/package.json
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_PACKAGE: ${{ needs.verify.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ needs.verify.outputs.artifact-dir }}
      - name: Publish the verified tarball
        run: node scripts/publish-package.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify registry version, integrity and latest tag
        run: node scripts/verify-registry.mjs
      - name: Install the published React package from npm
        if: env.RELEASE_PACKAGE == 'react'
        run: node scripts/verify-react-package.mjs --published
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.verify.outputs.package-name }}
          PACKAGE_ARTIFACT: ${{ needs.verify.outputs.artifact-dir }}/${{ needs.verify.outputs.artifact-file }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "$PACKAGE_ARTIFACT" --verify-tag --title "$PACKAGE_NAME $RELEASE_TAG" --generate-notes
          fi
